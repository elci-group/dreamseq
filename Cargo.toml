[workspace]
members = [".", "mobile/src-tauri"]
resolver = "2"

[package]
name = "dreamseq"
version = "1.3.19"
edition = "2024"
license = "MIT"
authors = ["Dreamsequence Ltd"]
description = "Privacy-conscious engineering intelligence for human-AI collaboration"
repository = "https://github.com/elci-group/dreamseq"
readme = "README.md"
exclude = ["mobile/", "scripts/", "docs/", "anthologies/", "output/", ".dreams/", ".kaptaind/", ".github/", "plans/"]

[dependencies]
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
json5 = "0.4"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.0"
regex = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0"
glob = "0.3"
form3 = { git = "https://github.com/elci-group/form3.git", branch = "main" }
ratatui = "0.30.2"
crossterm = "0.29.0"
