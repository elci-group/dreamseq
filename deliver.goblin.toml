[[file]]
path = "src/goblin_gateway.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!"]

[[command]]
name = "dreamseq tests"
cmd = ["cargo", "test"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[[command]]
name = "dreamseq check"
cmd = ["cargo", "check"]
expect_exit = 0
timeout_secs = 300
