[[file]]
path = "src/lib.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!", "panic!"]

[[file]]
path = "src/main.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!", "panic!"]

[[file]]
path = "src/cloud.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!", "panic!"]
require_regex = ["CredentialStore", "device/authorize", "device/token", "api/v1/runs"]

[[file]]
path = "src/groq.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!", "panic!"]
require_regex = ["DREAMSEQ_BYOK_ROUTES", "configured_byok_routes", "validate_provider_url"]

[[file]]
path = "src/inference_transport.rs"
required = true
forbid_regex = ["TODO", "FIXME", "unimplemented!", "panic!"]
require_regex = ["api/v1/inference", "request_openai_compatible", "request_cloud"]

[[file]]
path = "Cargo.toml"
required = true

[[file]]
path = "README.md"
required = true

[[command]]
name = "cargo fmt check"
cmd = ["cargo", "fmt", "--", "--check"]
expect_exit = 0
timeout_secs = 60

[[command]]
name = "cargo clippy"
cmd = ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 180

[[command]]
name = "cargo test"
cmd = ["cargo", "test", "--all-targets", "--all-features", "--", "--skip", "groq_client_hits_custom_endpoint", "--skip", "full_pipeline_with_fixture_data", "--skip", "routed_inference_falls_back_to_byok", "--skip", "routed_inference_prefers_dreamsequence_cloud"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[git]
no_uncommitted_changes = false
no_untracked_files = false
